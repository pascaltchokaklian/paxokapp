{% extends "m_base_generic.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carte des Cols</title>
</head>
<body>
    {% block content %}
    <style>
        html,
        body {
            overflow: hidden;
        }

        .mobile-col-map-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            width: 100vw;
            height: 100vh;
            background: #fff;
        }

        .mobile-col-map-screen iframe {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            border: 0;
        }

        .mobile-col-map-back {
            display: inline-block !important;
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            z-index: 10000;
            padding: 8px 12px;
            border-radius: 6px;
            background: #fff !important;
            color: #222 !important;
            font-size: 14px !important;
            font-weight: 600;
            line-height: 1.2;
            opacity: 1 !important;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
    </style>

    <div class="mobile-col-map-screen">
        <a href="{% url 'm_colsok' %}" class="mobile-col-map-back">Retour à la liste</a>
        {{ colsok_map|safe }}
    </div>
    {% endblock %}
</body>
</html>
